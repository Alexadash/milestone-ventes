<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Milestone ventes</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1220;
      color: #f8fafc;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .wrap { text-align: center; }
    .label { color: #9ca3af; margin-bottom: 12px; }
    .amount { font-size: 6rem; font-weight: 800; }
    .currency { font-size: .5em; }
    .date { margin-top: 20px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="label">Montant restant à faire pour faire l'année :</div>
    <div class="amount">
      23&nbsp;107,94<span class="currency">$</span>
    </div>
    <div class="date">Dernière mise à jour : 27 décembre 15h00</div>
  </div>
</body>
</html>
